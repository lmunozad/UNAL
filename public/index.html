<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vinculación de personal - Piloto de automatización</title>
<style>
  :root {
    --azul: #1a3a6b;
    --gris-texto: #444;
    --gris-borde: #d0d0d0;
    --fondo: #f5f6f8;
    --error: #b3261e;
    --ok: #1e7d4a;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--fondo);
    color: var(--gris-texto);
    margin: 0;
    padding: 2rem 1rem;
  }
  .tarjeta {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 10px;
    padding: 2rem;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  h1 { font-size: 1.3rem; color: var(--azul); margin: 0 0 0.25rem; }
  .subtitulo { font-size: 0.9rem; color: #777; margin: 0 0 1.5rem; }
  .barra { display: flex; gap: 6px; margin-bottom: 1.5rem; }
  .barra div { flex: 1; height: 5px; border-radius: 3px; background: var(--gris-borde); }
  .barra div.activo { background: var(--azul); }
  label { display: block; font-size: 0.85rem; color: #555; margin: 0.9rem 0 0.3rem; }
  input, select {
    width: 100%; padding: 0.6rem 0.7rem; border: 1px solid var(--gris-borde);
    border-radius: 6px; font-size: 0.95rem;
  }
  .fila { display: flex; gap: 10px; }
  .fila > div { flex: 1; }
  .error { color: var(--error); font-size: 0.8rem; margin-top: 4px; }
  .botones { display: flex; justify-content: space-between; margin-top: 1.8rem; }
  button {
    background: var(--azul); color: #fff; border: none; padding: 0.65rem 1.3rem;
    border-radius: 6px; font-size: 0.9rem; cursor: pointer;
  }
  button.secundario { background: #fff; color: var(--azul); border: 1px solid var(--azul); }
  button:hover { opacity: 0.92; }
  .resumen { background: var(--fondo); border-radius: 8px; padding: 1rem; font-size: 0.9rem; line-height: 1.9; }
  .paso { display: none; }
  .paso.activo { display: block; }
  .estado { text-align: center; padding: 1.5rem 0; }
  .ok { color: var(--ok); font-size: 2rem; }
  .descarga { display: inline-block; margin-top: 0.8rem; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="tarjeta">
  <h1>Vinculación de personal administrativo</h1>
  <p class="subtitulo">Piloto de automatización — Universidad Nacional de Colombia</p>
  <div class="barra" id="barra"><div></div><div></div><div></div></div>

  <div class="paso" id="paso-1">
    <label>Nombres y apellidos completos</label>
    <input id="nombre" placeholder="Ej. María Camila Restrepo Gómez">
    <div class="error" id="err-nombre" style="display:none">Falta el nombre completo</div>

    <label>Tipo y número de identificación</label>
    <div class="fila">
      <div>
        <select id="tipo_id"><option>C.C.</option><option>C.E.</option><option>Visa</option></select>
      </div>
      <div><input id="numero_id" placeholder="52.784.910"></div>
    </div>
    <div class="error" id="err-id" style="display:none">Falta el número de identificación</div>

    <label>Ciudad donde se expidió el documento</label>
    <input id="ciudad_exp" placeholder="Bogotá D.C.">

    <div class="botones"><span></span><button onclick="irPaso(2)">Siguiente</button></div>
  </div>

  <div class="paso" id="paso-2">
    <label>Modalidad del nombramiento</label>
    <select id="modalidad">
      <option value="periodo_prueba">Periodo de prueba</option>
      <option value="lnr">Libre nombramiento y remoción</option>
      <option value="provisionalidad" selected>Provisionalidad</option>
      <option value="encargo">Encargo</option>
      <option value="supernumerario">Supernumerario</option>
    </select>

    <label>Cargo y código-grado</label>
    <div class="fila">
      <div><input id="cargo" placeholder="Profesional Especializado"></div>
      <div><input id="codigo_grado" placeholder="2028-14"></div>
    </div>

    <label>Dependencia y sede</label>
    <div class="fila">
      <div><input id="dependencia" placeholder="Dirección de Personal"></div>
      <div><input id="sede" placeholder="Bogotá"></div>
    </div>

    <label>Número de resolución</label>
    <input id="numero_resolucion" placeholder="0456">

    <div class="botones">
      <button class="secundario" onclick="irPaso(1)">Atrás</button>
      <button onclick="irPaso(3)">Siguiente</button>
    </div>
  </div>

  <div class="paso" id="paso-3">
    <p style="font-size:0.9rem;color:#666">Revisa antes de generar tus documentos.</p>
    <div class="resumen" id="resumen"></div>
    <div class="botones">
      <button class="secundario" onclick="irPaso(2)">Atrás</button>
      <button onclick="generar()">Generar documentos</button>
    </div>
  </div>

  <div class="paso" id="paso-4">
    <div class="estado">
      <div class="ok" id="icono-estado">✓</div>
      <p id="mensaje-estado">Generando tus documentos...</p>
      <div id="descargas"></div>
    </div>
  </div>
</div>

<script>
const API = ""; // misma URL donde se sirve esta página

function irPaso(n) {
  document.querySelectorAll(".paso").forEach((p, i) => p.classList.toggle("activo", i === n - 1));
  document.querySelectorAll("#barra div").forEach((d, i) => d.classList.toggle("activo", i < n));

  if (n === 3) {
    document.getElementById("resumen").innerHTML = `
      <b>Nombre:</b> ${valor("nombre")}<br>
      <b>Identificación:</b> ${valor("tipo_id")} ${valor("numero_id")} de ${valor("ciudad_exp")}<br>
      <b>Modalidad:</b> ${document.getElementById("modalidad").selectedOptions[0].text}<br>
      <b>Cargo:</b> ${valor("cargo")} (${valor("codigo_grado")})<br>
      <b>Dependencia / Sede:</b> ${valor("dependencia")} / ${valor("sede")}<br>
      <b>Resolución No.:</b> ${valor("numero_resolucion")}
    `;
  }
}

function valor(id) { return document.getElementById(id).value || "—"; }

function construirExpediente() {
  const hoy = new Date();
  const meses = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
  const modalidad = document.getElementById("modalidad").value;
  const marcas = { periodo_prueba:"", lnr:"", provisionalidad:"", encargo:"", supernumerario:"" };
  marcas[modalidad] = "X";

  return {
    nombre_completo: valor("nombre"),
    tipo_identificacion: valor("tipo_id"),
    numero_identificacion: valor("numero_id"),
    ciudad_expedicion: valor("ciudad_exp"),
    x_periodo_prueba: marcas.periodo_prueba,
    x_lnr: marcas.lnr,
    x_provisionalidad: marcas.provisionalidad,
    x_encargo: marcas.encargo,
    x_supernumerario: marcas.supernumerario,
    cargo: valor("cargo"),
    codigo_grado: valor("codigo_grado"),
    dependencia: valor("dependencia"),
    sede: valor("sede"),
    numero_resolucion: valor("numero_resolucion"),
    dia_resolucion: String(hoy.getDate()),
    mes_resolucion: meses[hoy.getMonth()],
    ano_resolucion: String(hoy.getFullYear()),
    dependencia_expide_resolucion: "Vicerrectoría de Sede " + valor("sede"),
    dia_firma: String(hoy.getDate()),
    mes_firma: meses[hoy.getMonth()],
    ano_firma: String(hoy.getFullYear()),
    ciudad_solicitud: valor("ciudad_exp"),
    fecha_solicitud: hoy.toLocaleDateString("es-CO"),
    entidad_origen_traslado: "N/A",
    entidad_destino: "N/A",
    entidad_pension: "Por definir",
    entidad_salud: "Por definir",
    entidad_cesantias: "Por definir",
    fecha_nacimiento: "Por definir",
    direccion_residencia: "Por definir",
    telefono: "Por definir",
    celular: "Por definir",
    correo_electronico: "Por definir",
    salario: "Por definir",
  };
}

async function generarUno(codigo, expediente) {
  const resp = await fetch(`${API}/api/generar/${codigo}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(expediente),
  });
  if (!resp.ok) throw new Error(`Error generando el formato ${codigo}`);
  const blob = await resp.blob();
  return URL.createObjectURL(blob);
}

async function generar() {
  irPaso(4);
  const estado = document.getElementById("mensaje-estado");
  const descargas = document.getElementById("descargas");
  const icono = document.getElementById("icono-estado");
  try {
    const expediente = construirExpediente();
    const url080 = await generarUno("080", expediente);
    const url090 = await generarUno("090", expediente);

    estado.textContent = "Tus documentos están listos:";
    descargas.innerHTML = `
      <div><a class="descarga" href="${url080}" download="Aceptacion_Nombramiento.docx">Descargar Aceptación de Nombramiento (080)</a></div>
      <div><a class="descarga" href="${url090}" download="Afiliacion_Seguridad_Social.docx">Descargar Afiliación a Seguridad Social (090)</a></div>
    `;
  } catch (e) {
    icono.textContent = "!";
    icono.style.color = "#b3261e";
    estado.textContent = "Ocurrió un problema generando los documentos. Intenta de nuevo.";
    console.error(e);
  }
}

irPaso(1);
</script>
</body>
</html>
